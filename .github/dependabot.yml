version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Mergify squash-merges Dependabot PRs once the `test` check passes (see
    # .mergify.yml), so only minor and patch updates are proposed. Review major
    # upgrades by hand.
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    commit-message:
      prefix: "deps"
