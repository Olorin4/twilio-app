name: CI/CD Pipeline

# CI (tests + frontend build) runs on every push and pull request.
# Deployment is manual only: Actions -> CI/CD Pipeline -> Run workflow on
# master. The app runs as the `twilio-app` Docker container on the VPS and is
# built from source there (see docs/workspaces-and-communications-design.md,
# "Deployment"). The workflow never writes or replaces the server's .env.
#
# Repository secrets required for the deploy job only:
#   DEPLOY_HOST         VPS hostname or IP
#   DEPLOY_USER         SSH user that owns ~/apps/twilio-app
#   DEPLOY_SSH_KEY      private key for that user (use a dedicated deploy key)
#   DEPLOY_KNOWN_HOSTS  output of `ssh-keyscan -H <host>`, checked in advance

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Run tests
        run: npm test

      - name: Build frontend
        run: npm run build

  deploy:
    needs: test
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-twilio-app
      cancel-in-progress: false
    env:
      APP_DIR: apps/twilio-app
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Sync source (leaves the server .env untouched)
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          rsync -az --delete \
            --exclude='/.env' \
            --filter='P /.env.development' --filter='P /.env.test' \
            --exclude='.git' --exclude='node_modules' --exclude='dist' \
            -e "ssh -i ~/.ssh/deploy_key -o BatchMode=yes" \
            ./ "$DEPLOY_USER@$DEPLOY_HOST:$APP_DIR/"

      - name: Build and restart twilio-app, roll back on failure
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "SHORT_SHA=$SHORT_SHA APP_DIR=$APP_DIR bash -s" <<'EOF'
          set -euo pipefail
          cd "$APP_DIR"
          # Keep the running image so a failed deploy can be undone.
          docker tag twilio-app:latest "twilio-app:before-$SHORT_SHA"
          docker compose up -d --build
          sleep 10
          # Any HTTP response below 500 (401 without a login is expected)
          # means the app is serving; a refused connection or 5xx is a failure.
          if docker exec twilio-app node -e "require('http').get('http://127.0.0.1:3001/', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"; then
            docker tag twilio-app:latest "twilio-app:release-$SHORT_SHA"
            echo "Deployed $SHORT_SHA"
          else
            echo "Health check failed; rolling back to the previous image" >&2
            docker tag "twilio-app:before-$SHORT_SHA" twilio-app:latest
            docker compose up -d --no-build
            exit 1
          fi
          EOF
